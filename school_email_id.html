<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="//js.jotform.com/JotFormCustomWidget.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: -apple-system, "Segoe UI", Arial, sans-serif;
            color: #222;
        }
        body { padding: 4px 2px 8px 2px; }

        /* ─── Native-JotForm-style label, input, sublabel ─── */
        .field-label {
            display: block;
            font-size: 16px;
            font-weight: 700;
            color: #1B6CA8;             /* peacock blue (matches form theme) */
            margin: 0 0 10px 2px;
        }
        .field-label .req {
            color: #d73a49;             /* red asterisk */
            margin-left: 4px;
            font-weight: 700;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d8d8d8;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            background: #fff;
            color: #222;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input[type="email"]:focus {
            outline: none;
            border-color: #1B6CA8;
            box-shadow: 0 0 0 3px rgba(27,108,168,0.15);
        }
        input.invalid { border-color: #d73a49; }

        .sublabel {
            font-size: 13px;
            color: #d73a49;             /* red helper text */
            margin: 8px 2px 0 2px;
            line-height: 1.4;
        }

        .status {
            font-size: 12px;
            margin-top: 6px;
            color: #6b7280;
            min-height: 0;
        }
        .status.checking { color: #6b7280; }
        .status.ok       { color: #1e7e34; font-weight: 500; }
        .status.invalid  { color: #d73a49; }

        /* ─── Duplicate banner ─── */
        .dup-card {
            margin-top: 12px;
            border: 1px solid #f5c2c7;
            border-radius: 10px;
            background: #fff8f8;
            box-shadow: 0 2px 8px rgba(220, 53, 69, 0.06);
            overflow: hidden;
            font-size: 13px;
            line-height: 1.45;
            color: #58151c;
        }
        .dup-header {
            background: #f8d7da;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 700;
            color: #842029;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dup-header .icon {
            font-size: 18px;
            line-height: 1;
        }
        .dup-body {
            padding: 14px 16px;
        }
        .dup-intro {
            margin: 0 0 12px 0;
            color: #58151c;
        }
        .dup-intro .school {
            color: #1B6CA8;
            font-weight: 700;
        }
        .dup-table {
            width: 100%;
            border-collapse: collapse;
            margin: 0 0 14px 0;
            background: #fff;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #f1d3d6;
        }
        .dup-table td {
            padding: 7px 10px;
            font-size: 12.5px;
            border-bottom: 1px solid #f6e5e7;
            vertical-align: top;
        }
        .dup-table tr:last-child td { border-bottom: 0; }
        .dup-table .label {
            color: #6b7280;
            font-weight: 500;
            width: 38%;
            white-space: nowrap;
        }
        .dup-table .value {
            color: #222;
            font-weight: 600;
            word-break: break-word;
        }

        .dup-action {
            background: #fff3cd;
            border: 1px solid #ffe08a;
            border-radius: 8px;
            padding: 10px 12px;
            margin: 0 0 12px 0;
            color: #5f4500;
            font-size: 13px;
        }
        .dup-action b { color: #5f4500; }

        .edit-link {
            display: inline-block;
            padding: 10px 18px;
            background: #1B6CA8;
            color: #fff !important;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.15s;
        }
        .edit-link:hover { background: #155a8b; }

        .spinner {
            display: inline-block;
            width: 10px;
            height: 10px;
            border: 2px solid #ccc;
            border-top-color: #1B6CA8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <input type="email" id="email" autocomplete="email" />

    <div class="sublabel">
        Only 1 submission is allowed per school. A submission can be edited multiple times.
    </div>

    <div id="status" class="status"></div>

<script>
    // ─────────────────────────────────────────────────────────
    // CONFIG — paste your Apps Script web-app URL here.
    // ─────────────────────────────────────────────────────────
    const APPS_SCRIPT_URL =
        'https://script.google.com/macros/s/AKfycby5F3Zis36f1Nfon2muPXdYhY3-N8goaYB19xSZpuFNaEwC-VzDYWzUAHDvnU4Fp_Lw/exec';

    const DEBOUNCE_MS       = 600;     // wait this long after user stops typing
    const RECHECK_AFTER_MS  = 60000;   // re-use a recent result for the same email

    const input  = document.getElementById('email');
    const status = document.getElementById('status');

    let checkTimer    = null;
    let lastChecked   = { email: '', at: 0, found: false, info: null };
    let cachedEmails  = null;          // lowercase array of all registered emails
    let cachedEmailsPromise = null;    // in-flight fetch (avoid duplicate calls)

    // ─────────────────────────────────────────────────────────
    // Edit-mode signal — set when JotForm fires `ready` with a
    // pre-filled email value. Lets us recognize "the user's own
    // existing email" and skip the duplicate warning.
    // ─────────────────────────────────────────────────────────
    let originalEmail = '';

    // Best-effort edit-mode detection — tries every URL source we can read
    // from inside an iframe. JotForm sometimes nests widgets two iframes deep,
    // so referrer / top.location alone aren't reliable.
    const editingSubmissionId = (function () {
        function matchEdit(s) {
            if (!s) return null;
            const m = String(s).match(/\/edit\/(\d+)/);
            return m ? m[1] : null;
        }
        let id = null;

        // 1. document.referrer
        id = matchEdit(document.referrer); if (id) return id;

        // 2. window.parent.location.href (may be cross-origin blocked)
        try { id = matchEdit(window.parent.location.href); } catch (e) {}
        if (id) return id;

        // 3. window.top.location.href (same caveat)
        try { id = matchEdit(window.top.location.href); } catch (e) {}
        if (id) return id;

        // 4. window.location.ancestorOrigins (gives origins only, not paths,
        //    but if we see jotform.com in the chain we know we're embedded).
        try {
            const ao = window.location.ancestorOrigins;
            if (ao && ao.length) {
                for (let i = 0; i < ao.length; i++) {
                    // We can't extract the submission ID from origin alone,
                    // but if we ever get a full URL via another mechanism
                    // we know to trust it.
                    console.log('[email-checker] ancestorOrigin[' + i + ']:', ao[i]);
                }
            }
        } catch (e) {}

        // 5. Query / hash on our own URL (in case JotForm passes it through)
        id = matchEdit(window.location.search); if (id) return id;
        id = matchEdit(window.location.hash);   if (id) return id;

        return null;
    })();

    // JotForm can deliver the saved widget value in any of several shapes,
    // depending on form version / page / device. Mirror widget.html and try
    // every known path so edit-mode restore works across all devices.
    function extractSavedValue(data) {
        if (!data) return '';
        if (typeof data === 'string') return data;
        return (
            data.value ||
            (data.fieldData && data.fieldData.value) ||
            (data.data && data.data.value) ||
            ''
        );
    }

    // Apply a restored value coming back from JotForm (either ready or
    // populate). Sets the input + originalEmail and re-triggers a check.
    function applyRestoredValue(source, raw) {
        const val = String(raw || '').trim();
        if (!val) return;
        if (input.value && input.value.trim().toLowerCase() === val.toLowerCase()) {
            originalEmail = val.toLowerCase();
            console.log('[email-checker] %s: value already set, captured originalEmail =',
                source, originalEmail);
            return;
        }
        input.value = val;
        originalEmail = val.toLowerCase();
        console.log('[email-checker] %s: restored email "%s" (edit mode)', source, val);
        sendUpward();
        if (isValidEmail(input.value)) scheduleCheck(0);
    }

    // ────────── Auto-resize iframe ──────────
    if (window.ResizeObserver) {
        new ResizeObserver(() => {
            try {
                JFCustomWidget.requestFrameResize({
                    width: '100%',
                    height: document.body.offsetHeight + 20
                });
            } catch (e) {}
        }).observe(document.body);
    }

    // ────────── JotForm lifecycle ──────────
    JFCustomWidget.subscribe('ready', function () {
        // JotForm calls ready() with varying signatures (single object, or
        // formId+value strings). Inspect every argument and try all known
        // value paths.
        const args = arguments;
        console.log('[email-checker] ready event fired');
        console.log('[email-checker]   arg[0]:', JSON.stringify(args[0]));
        console.log('[email-checker]   arg[1]:', JSON.stringify(args[1]));
        console.log('[email-checker]   document.referrer:', document.referrer);
        console.log('[email-checker]   editingSubmissionId:', editingSubmissionId);

        let saved = '';
        for (let i = 0; i < args.length && !saved; i++) saved = extractSavedValue(args[i]);

        if (saved) {
            applyRestoredValue('ready', saved);
        } else {
            console.log('[email-checker]   no pre-filled value yet (may still arrive via "populate")');
        }

        // Kick off the pre-fetch of the full email list in the background so
        // the local yes/no check is instant by the time the user types.
        prefetchEmailList();

        sendUpward();
        if (isValidEmail(input.value)) scheduleCheck(0);
    });

    // Edit-mode restore: JotForm fires `populate` (sometimes AFTER `ready`)
    // to re-hydrate the widget with its saved value. This is how widget.html
    // survives edit-from-a-new-device — without it, the widget thinks it's a
    // fresh submission and shows the duplicate banner against itself.
    JFCustomWidget.subscribe('populate', function (data) {
        console.log('[email-checker] populate event fired');
        console.log('[email-checker]   data:', JSON.stringify(data));
        const saved = extractSavedValue(data);
        if (saved) applyRestoredValue('populate', saved);
    });

    function prefetchEmailList() {
        if (cachedEmails || cachedEmailsPromise) return cachedEmailsPromise;
        const t0 = Date.now();
        cachedEmailsPromise = fetch(APPS_SCRIPT_URL + '?action=listEmails', { method: 'GET' })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                cachedEmails = (data && data.emails || [])
                    .map(function (s) { return String(s).trim().toLowerCase(); });
                console.log('[email-checker] Pre-fetched %d emails in %dms',
                    cachedEmails.length, Date.now() - t0);
            })
            .catch(function (err) {
                console.log('[email-checker] Pre-fetch failed:', err.message);
                cachedEmails = null;     // fall back to direct check
            });
        return cachedEmailsPromise;
    }

    JFCustomWidget.subscribe('submit', function () {
        const email = input.value.trim();
        const valid = isValidEmail(email) && !lastChecked.found;
        JFCustomWidget.sendSubmit({ value: email, valid: valid });
    });

    // ────────── Input handler ──────────
    input.addEventListener('input', function () {
        clearTimeout(checkTimer);
        clearStatus();
        input.classList.remove('invalid');

        const email = input.value.trim();
        if (!email) { sendUpward(); return; }

        if (!isValidEmail(email)) {
            input.classList.add('invalid');
            setStatus('Please enter a valid email address.', 'invalid');
            sendUpward();
            return;
        }
        scheduleCheck(DEBOUNCE_MS);
    });

    function scheduleCheck(delay) {
        const email = input.value.trim().toLowerCase();
        if (lastChecked.email === email &&
            (Date.now() - lastChecked.at) < RECHECK_AFTER_MS) {
            applyResult(lastChecked.found, lastChecked.info);
            return;
        }
        setStatus('<span class="spinner"></span>Checking for previous registrations…', 'checking');
        checkTimer = setTimeout(() => doCheck(email), delay);
    }

    async function doCheck(email) {
        // ── PHASE 1: instant local check via the pre-fetched email list ──
        // If a list is available, we can answer yes/no without a network roundtrip.
        const lc = email.toLowerCase();
        if (cachedEmails) {
            const isDup = cachedEmails.indexOf(lc) !== -1;
            console.log('[email-checker] Local check for "' + lc + '" → ' + (isDup ? 'DUPLICATE' : 'unique'));

            if (!isDup) {
                lastChecked = { email: email, at: Date.now(), found: false, info: null };
                applyResult(false, null);
                return;
            }

            // It's a duplicate — show the warning IMMEDIATELY with placeholder
            // "Loading details…" while we fetch the full info in the background.
            showDuplicateLoading();
            lastChecked = { email: email, at: Date.now(), found: true, info: null };
            sendUpward();           // mark invalid right away so submit is blocked
        }

        // ── PHASE 2: fetch full details (either no local list, or to fill banner) ──
        try {
            const url = APPS_SCRIPT_URL +
                '?action=checkEmail&email=' + encodeURIComponent(email);
            const res = await fetch(url, { method: 'GET' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const data = await res.json();
            lastChecked = { email: email, at: Date.now(), found: !!data.found, info: data };
            applyResult(data.found, data);
        } catch (err) {
            setStatus('Could not check registrations (' + err.message + '). You can still submit.', '');
            sendUpward();
        }
    }

    // Show an instant "duplicate found, loading details…" banner so the user
    // gets feedback before the full info fetch finishes.
    function showDuplicateLoading() {
        // Match the same currentEmail-is-own-submission check we do in applyResult,
        // so editors don't see a flash of the warning.
        const currentEmailLc = String(input.value || '').trim().toLowerCase();
        if (originalEmail && currentEmailLc === originalEmail) {
            setStatus('✓ You are editing your own submission — proceed normally.', 'ok');
            return;
        }
        status.className = 'status';
        status.innerHTML =
            '<div class="dup-card">' +
              '<div class="dup-header">' +
                '<span class="icon">⚠️</span> Existing Registration Found' +
              '</div>' +
              '<div class="dup-body">' +
                '<p class="dup-intro">A submission has already been registered using this email address.</p>' +
                '<div class="dup-action">' +
                  '<b>Please <u>edit your existing submission</u></b> instead of creating a new one.' +
                '</div>' +
                '<div style="font-size:12px; color:#6b7280; display:flex; align-items:center; gap:8px;">' +
                  '<span class="spinner"></span> Loading submission details…' +
                '</div>' +
              '</div>' +
            '</div>';
    }

    function applyResult(found, info) {
        // ── DEBUG ──
        console.log('[email-checker] applyResult called');
        console.log('[email-checker]   found:', found);
        console.log('[email-checker]   info:', JSON.stringify(info));
        console.log('[email-checker]   current input value:', input.value);
        console.log('[email-checker]   originalEmail (captured at ready):', originalEmail);
        console.log('[email-checker]   editingSubmissionId (from URL):', editingSubmissionId);

        if (!found) {
            setStatus('✓ No previous registration with this email.', 'ok');
            sendUpward();
            return;
        }

        // ── If this matches the user's OWN submission, don't treat it as a duplicate ──
        const currentEmailLc = String(input.value || '').trim().toLowerCase();
        const matchesOriginalEmail =
            originalEmail && currentEmailLc && currentEmailLc === originalEmail;
        const matchesEditingSid =
            editingSubmissionId && info && info.submissionID &&
            String(info.submissionID) === String(editingSubmissionId);

        console.log('[email-checker]   currentEmailLc:', currentEmailLc);
        console.log('[email-checker]   matchesOriginalEmail:', matchesOriginalEmail);
        console.log('[email-checker]   matchesEditingSid:', matchesEditingSid);

        if (matchesOriginalEmail || matchesEditingSid) {
            console.log('[email-checker]   → Skipping duplicate warning (own submission).');
            setStatus('✓ You are editing your own submission — proceed normally.', 'ok');
            lastChecked.found = false;
            sendUpward();
            return;
        }

        console.log('[email-checker]   → Showing duplicate warning + clearing field.');

        const rows = [];
        if (info.submitDate)   rows.push(['Originally submitted', info.submitDate]);
        if (info.schoolEmail)  rows.push(['School email',         info.schoolEmail]);
        if (info.teacherName)  rows.push(['Primary teacher',      info.teacherName]);
        if (info.teacherPhone) rows.push(['Teacher contact',      info.teacherPhone]);
        if (info.teacherEmail) rows.push(['Teacher email',        info.teacherEmail]);
        if (info.submissionID) rows.push(['Submission ID',        info.submissionID]);

        const tableHtml = rows.map(function (r) {
            return '<tr>' +
                     '<td class="label">' + escapeHtml(r[0]) + '</td>' +
                     '<td class="value">' + escapeHtml(r[1]) + '</td>' +
                   '</tr>';
        }).join('');

        const editUrl    = info.editURL ? escapeHtml(info.editURL) : '';
        const editButton = editUrl
            ? '<a class="edit-link" href="' + editUrl + '" target="_blank" rel="noopener">' +
                  '✎ Edit Existing Submission' +
              '</a>'
            : '';

        const schoolName = info.schoolName
            ? '<span class="school">' + escapeHtml(info.schoolName) + '</span>'
            : 'this school';

        status.className = 'status';
        status.innerHTML =
            '<div class="dup-card">' +
              '<div class="dup-header">' +
                '<span class="icon">⚠️</span> Existing Registration Found' +
              '</div>' +
              '<div class="dup-body">' +
                '<p class="dup-intro">A submission for ' + schoolName +
                  ' has already been registered using this email address.</p>' +
                (rows.length ? '<table class="dup-table">' + tableHtml + '</table>' : '') +
                '<div class="dup-action">' +
                  '<b>Please <u>edit your existing submission</u></b> instead of creating a new one. ' +
                '</div>' +
                editButton +
              '</div>' +
            '</div>';

        // Clear the input so the (required) field is empty — JotForm will
        // therefore prevent the submission and force a deliberate next action.
        input.value = '';
        sendUpward();
    }

    // ────────── Helpers ──────────
    function sendUpward() {
        const email = input.value.trim();
        const valid = isValidEmail(email) && !lastChecked.found;
        try { JFCustomWidget.sendData({ value: email, valid: valid }); } catch (e) {}
    }

    function setStatus(html, cls) {
        status.className = 'status ' + (cls || '');
        status.innerHTML = html;
    }
    function clearStatus() { status.className = 'status'; status.innerHTML = ''; }

    function isValidEmail(s) {
        return /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/.test((s || '').trim());
    }
    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = String(s == null ? '' : s);
        return d.innerHTML;
    }
</script>

</body>
</html>
